<div class="d-flex justify-content-center mt-5">
  <div class="col-3">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="text-center mb-4">
        <h1 class="h3 mb-3 font-weight-normal">Delivery Login</h1>
      </div>

      <div class="form-floating mb-3">
        <input 
          type="email" 
          formControlName="email"
          class="form-control" 
          id="floatingEmail" 
          placeholder="name@example.com"
          [ngClass]="{'is-invalid': loginForm.get('email').touched && loginForm.get('email').invalid}"
        >
        <label for="floatingEmail">Email address</label>
        <div class="invalid-feedback" *ngIf="loginForm.get('email').errors?.required">
          Email is required
        </div>
        <div class="invalid-feedback" *ngIf="loginForm.get('email').errors?.email">
          Invalid email format
        </div>
      </div>

      <div class="form-floating mb-3">
        <input 
          type="password" 
          formControlName="password"
          class="form-control" 
          id="floatingPassword" 
          placeholder="Password"
          [ngClass]="{'is-invalid': loginForm.get('password').touched && loginForm.get('password').invalid}"
        >
        <label for="floatingPassword">Password</label>
        <div class="invalid-feedback" *ngIf="loginForm.get('password').errors?.required">
          Password is required
        </div>
      </div>

      <button class="w-100 btn btn-lg btn-primary" type="submit" [disabled]="loginForm.invalid">
        Sign in
      </button>
    </form>
  </div>
</div>
